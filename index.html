<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Profile</title>
  <link rel="stylesheet" type="text/css" href="css/login/general.css">
  <link rel="stylesheet" type="text/css" href="css/login/login.css">
</head>
<body>

  <div class="screen-container">
    
    <img class="bg-image">
    
    <div class="shadow-overlay"></div>

    <div class="curved-floor"></div>

    <div class="content-wrapper">
      
<div class="logo-container">
    <div id="netflix-wrapper" class="netflix-wrapper">
        <img class="netflix-logo-placeholder" alt="">
    </div>
    <div id="show-logo-wrapper" class="show-logo-wrapper">
        <img class="show-logo-placeholder" alt="Show Logo">
    </div>
</div>



      <h1 class="title">Choose Your Profile</h1>

      <div class="profiles-row">
        
        <div class="profile">
          <a href="home.html" class="profile-link">
          <div class="avatar bg-blue">
            <img class="avatar" src="media/icons/login/login-blue-nobg.png">
          </div>
          <span class="name">Dennis</span>
</a>
        </div>

        <div class="profile">
          <a href="home.html" class="profile-link">
          <div class="avatar bg-yellow">
            <img class="avatar" src="media/icons/login/login-red-nobg.png">
          </div>
          <span class="name">Eden</span>
</a>
        </div>

        <div class="profile">
          <a href="home.html" class="profile-link">
          <div class="avatar bg-yellow">
            <img class="avatar" src="media/icons/login/login-yellow.jpeg">
          </div>
          <span class="name">Apex</span>
</a>
        </div>

        <div class="profile">
          <a href="home.html" class="profile-link">
            <div class="avatar bg-teal">
              <img class="avatar" src="media/icons/login/login-teal.jpeg">
            </div>
            <span class="name">YumYum</span>
          </a>
        </div>

        <div class="profile">
          <a href="home.html" class="profile-link">
          <div class="avatar bg-green">
            <img class="avatar" src="media/icons/login/login-green.jpeg">
          </div>
          <span class="name">Mama</span>
</a>
        </div>

        <div class="profile">
          <div class="avatar bg-gray">
            <img class="avatar" src="media/icons/login/edit.jpeg">
          </div>
          <span class="name">Edit</span>
        </div>

      </div>
    </div>
  </div>


<script src="login.js"></script>
</body>
</html>
