<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loading" id="loading">Loading…</div>
<div class="toast" id="toast" hidden></div>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <button class="pill" id="profileBtn" aria-label="Profile and privacy"><span class="av" id="meAv">?</span><span class="dots">•••</span></button>
      <h2><button id="home">Chats</button></h2><span></span>
    </div>
    <div class="tabs side-only" data-tabs></div>
    <div class="side-scroll">
      <section class="card" id="cardPeople"><h3>Around You</h3><div id="people"></div><button class="more" id="morePeople">More…</button></section>
      <section class="card" id="cardFriends" hidden><h3>Friends</h3><div id="friends"></div></section>
      <section class="card" id="cardRooms"><h3>Public Conversations</h3><div id="rooms"></div><div id="newRoomBox"></div><button class="more" id="moreRooms">More…</button></section>
    </div>
  </aside>

  <main class="main">
    <div class="tabs" data-tabs></div>
    <div class="conn" id="conn" hidden>Reconnecting…</div>
    <button class="ibtn mob back" id="mback" style="position:absolute;z-index:13;left:1.6em;top:2.7em" aria-label="Back to chats"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    <div class="view on" id="v-map">
      <div class="map">
        <svg class="roads" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g fill="none" stroke="#1f1f21" stroke-width="2"><path d="M0 120H800M0 250H800M0 400H800M0 500H800M120 0V560M260 0V560M520 0V560M680 0V560"/></g>
          <g fill="none" stroke="#2c2c2f" stroke-width="14" stroke-linecap="round"><path d="M-20 470L330 200L560 -20"/><path d="M110 590L300 330L820 120"/><path d="M-20 300H820"/><path d="M430 -20V580"/><path d="M600 580L820 330"/></g>
        </svg>
        <button class="chip" id="showList">Show as list</button>
        <div class="me-dot" aria-label="You"></div>
        <div id="pins"></div>
        <div class="legend"><span><i style="--c:var(--green)"></i>Available</span><span><i style="--c:var(--blue)"></i>Looking to chat</span><span style="color:#8e8e93">Layout is illustrative — real proximity comes later</span></div>
      </div>
    </div>

    <div class="view" id="v-empty">
      <div class="empty" id="emptyCard">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4"/></svg>
        <h3>Nothing here</h3><p>You have no conversations yet. Start one!</p>
      </div>
    </div>

    <div class="view" id="v-chat">
      <div class="chead">
        <button class="ibtn compose" id="newMsg" aria-label="Find someone new"><svg viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-6"/><path d="M17.5 3.5l3 3L12 15l-4 1 1-4z"/></svg></button>
        <div class="contact"><div class="av" id="cAv"></div><div class="cname" id="cName"></div><div class="csub" id="cSub"></div></div>
        <button class="ibtn vid" disabled title="Voice and video come in a later phase" aria-label="Video (coming later)"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg></button>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="ibtn" disabled title="Attachments come later" aria-label="Add attachment"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="compose-field"><input id="text" placeholder="Message" aria-label="Message" maxlength="2000"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 7v10M13 9v6M17 6v12M21 10v4"/></svg></div>
      </form>
    </div>

    <div class="view" id="v-profile"><div class="formcard settings" id="profileBox"></div></div>

    <div class="view" id="v-me">
      <div class="formcard settings">
        <div class="pic"><div class="av" id="sAv"></div><div><h3 id="sName"></h3><small id="sUser"></small></div></div>
        <div><div class="lbl">Status</div>
          <div class="seg" id="seg"><button data-status="Available">Available</button><button data-status="Looking for a conversation">Looking for a conversation</button></div></div>
        <label class="switch"><span>Show me in Around You<small>When off, other people don’t see you on the list or the map.</small></span><input type="checkbox" id="disc" role="switch"></label>
        <button class="go" id="signout">Sign out</button>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
