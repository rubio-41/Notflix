<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chats</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loading" id="loading">Loading…</div>
<div class="toast" id="toast" hidden></div>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <button class="pill" id="profileBtn" aria-label="Your profile"><span class="av" id="meAv">?</span><span class="dots">•••</span></button>
      <h2><button id="home">Chats</button></h2><span></span>
    </div>
    <div class="tabs side-only" data-tabs></div>
    <div class="side-scroll">
      <section class="card" id="cardFriends" hidden><h3>Friends</h3><div id="friends"></div></section>
      <section class="card" id="cardPeople"><h3>Around You</h3><div id="people"></div><button class="more" id="morePeople">More…</button></section>
      <section class="card" id="cardRooms"><h3>Public Conversations</h3><div id="rooms"></div><div id="newRoomBox"></div><button class="more" id="moreRooms">More…</button></section>
    </div>
  </aside>

  <main class="main">
    <div class="tabs" data-tabs></div>
    <div class="conn" id="conn" hidden>Reconnecting…</div>
    <button class="ibtn mob" id="mback" style="position:absolute;z-index:1200;left:1.6em;top:2.7em" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    <!-- Map -->
    <div class="view on" id="v-map">
      <div id="mapEl"></div>
      <div class="mapmsg" id="mapMsg" hidden><p id="mapMsgText"></p><button id="mapMsgBtn">Turn on location</button></div>
      <button class="ibtn locate" id="locate" aria-label="Centre on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
    </div>

    <!-- Chats list / empty state -->
    <div class="view" id="v-empty">
      <div class="empty" id="emptyCard">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4"/></svg>
        <h3>Nothing here</h3><p>You have no conversations yet. Start one!</p>
      </div>
    </div>

    <!-- A conversation -->
    <div class="view" id="v-chat">
      <div class="chead">
        <button class="ibtn compose" id="newMsg" aria-label="New message"><svg viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-6"/><path d="M17.5 3.5l3 3L12 15l-4 1 1-4z"/></svg></button>
        <div class="contact"><div class="av" id="cAv"></div><div class="cname" id="cName"></div><div class="csub" id="cSub"></div></div>
        <button class="ibtn vid" id="callBtn" disabled aria-label="Call"></button>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="ibtn" disabled title="Attachments come later" aria-label="Add attachment"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="compose-field"><input id="text" placeholder="Message" aria-label="Message" maxlength="2000"><button type="button" class="micbtn" id="micBtn" aria-label="Record a voice message"><svg viewBox="0 0 24 24"><path d="M5 10v4M9 7v10M13 9v6M17 6v12M21 10v4"/></svg></button></div>
        <div class="recbar"><button type="button" class="ibtn" id="recCancel" aria-label="Cancel recording"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="recdot"></span><span id="recTime">0:00</span><button type="button" class="ibtn send" id="recSend" aria-label="Send voice message"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
      </form>
    </div>

    <!-- New message -->
    <div class="view scroll" id="v-new">
      <div class="panel">
        <h3>New message</h3>
        <input class="pillin" id="newSearch" placeholder="Search" aria-label="Search people" autocomplete="off">
        <div id="newList"></div>
      </div>
    </div>

    <!-- Voice rooms -->
    <div class="view scroll" id="v-voice"><div class="panel" id="voiceBox"></div></div>

    <!-- Someone's profile -->
    <div class="view scroll" id="v-profile"><div class="panel" id="profileBox"></div></div>

    <!-- Your profile and privacy -->
    <div class="view scroll" id="v-me">
      <div class="panel">
        <div class="top"><div class="av" id="sAv"></div><div><h3 id="sName"></h3><span class="sub" id="sUser"></span></div></div>
        <div><div class="lbl">Status</div><div class="seg" id="seg" style="margin-top:.8em"><button data-status="Available">Available</button><button data-status="Looking for a conversation">Looking for a conversation</button></div></div>
        <label class="switch"><span>Show me in Around You<small>When off, other people can’t see you on the list or the map.</small></span><input type="checkbox" id="disc" role="switch"></label>
        <div class="switch"><span>Location<small id="geoText"></small></span><button class="btn-quiet" id="geoBtn" style="font-size:1.6em;padding:0 1.6em">Turn on</button></div>
        <div id="pwBox"></div>
        <button class="btn-quiet" id="signout">Sign out</button>
      </div>
    </div>
  </main>
  <div class="callbar" id="callBar" hidden></div>
  <div class="incoming" id="incoming" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
